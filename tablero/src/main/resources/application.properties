spring.application.name=tablero
server.port=8080

# Servicios dueños de los datos. En Docker Compose se reemplazan con variables de entorno.
tablero.nucleo.url=http://localhost:18092/plataforma-desastres/api
tablero.servidor.url=http://localhost:18085
tablero.reconstruccion.host=localhost
tablero.reconstruccion.puerto=19096

# Pool acotado del tablero multihilo (ADR-24). Con el pool y la cola llenos responde 503.
tablero.hilos=16
tablero.cola=64
# Tiempo límite de cada fuente y de la respuesta completa del tablero, en milisegundos.
tablero.limite-fuente-ms=1500
tablero.limite-total-ms=3000
