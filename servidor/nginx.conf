resolver 127.0.0.11 valid=5s ipv6=off;
upstream mapas_api {
    zone mapas_api 64k;
    server api:8080 resolve;
}
upstream reconstruccion_api {
    zone reconstruccion_api 64k;
    server reconstruccion:8086 resolve;
}
# UD-09 Portal web: toda la interfaz (Spring MVC + Thymeleaf) y el servlet del tablero.
upstream portal_web {
    zone portal_web 64k;
    server portal:8080 resolve;
}
server {
    listen 80;
    server_tokens off;
    add_header Cache-Control "no-cache" always;
    client_max_body_size 2m;
    location = /api/campo/lotes {
        client_max_body_size 8m;
        proxy_pass http://mapas_api;
    }
    # UD-06 Reconstrucción: su API y su interfaz entran por la misma entrada
    location /api/reconstruccion/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://reconstruccion_api;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
    }
    location /api/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://mapas_api;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://portal_web;
        proxy_connect_timeout 5s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
