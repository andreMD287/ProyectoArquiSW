<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Error')}"></head>
<body>
<header th:replace="~{fragmentos :: barra}"></header>
<main class="contenido">
  <h1>No se pudo completar la operación</h1>
  <p class="aviso error" th:text="${mensaje != null ? mensaje : 'Ocurrió un error inesperado.'}">Error</p>
  <p class="tenue" th:if="${estado}" th:text="'Código ' + ${estado}"></p>
  <p><a href="javascript:history.back()">Volver</a> · <a href="/desastres">Ir a desastres</a></p>
</main>
</body>
</html>
