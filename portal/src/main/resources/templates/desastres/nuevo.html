<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Registrar desastre')}"></head>
<body>
<header th:replace="~{fragmentos :: barra}"></header>
<main class="contenido estrecho">
  <p><a href="/desastres">← Desastres</a></p>
  <h1>Registrar desastre</h1>
  <p>El desastre nace en fase <strong>Registro</strong>. Su ubicación exacta y el área afectada se
    agregan después, al caracterizarlo desde el portal o desde la app de campo.</p>
  <form method="post" action="/desastres" class="formulario tarjeta">
    <label>Tipo
      <select name="tipo" required>
        <option th:each="t : ${tipos}" th:value="${t}" th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(t, '_', ' ')))}">Tipo</option>
      </select>
    </label>
    <label>Ubicación (municipio, vereda o sector) <input name="ubicacion" required maxlength="200"></label>
    <label>Descripción inicial <textarea name="descripcion" required maxlength="2000" rows="4"></textarea></label>
    <label>Nivel inicial
      <select name="severidad">
        <option value="BAJA">Nivel 1 · Bajo: se atiende con recursos locales</option>
        <option value="MEDIA">Nivel 2 · Medio: coordinación entre varios organismos</option>
        <option value="ALTA">Nivel 3 · Alto: recursos regionales o nacionales</option>
        <option value="CRITICA">Nivel 4 · Crítico: coordinación nacional</option>
      </select>
    </label>
    <button>Registrar</button>
  </form>
</main>
</body>
</html>
