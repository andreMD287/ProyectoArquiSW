spring.application.name=portal
server.port=8080
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# La sesión viaja solo en la cookie, nunca en la URL (;jsessionid=...).
server.servlet.session.tracking-modes=cookie
spring.thymeleaf.cache=true
spring.mvc.format.date=yyyy-MM-dd

# Servicios dueños de los datos. En Docker Compose se reemplazan con variables de entorno.
portal.nucleo.url=http://localhost:18092/plataforma-desastres/api
portal.servidor.url=http://localhost:18085
portal.reconstruccion.host=localhost
portal.reconstruccion.puerto=19096

# Pool acotado del tablero multihilo (ADR-24). Con el pool y la cola llenos responde 503.
portal.tablero.hilos=16
portal.tablero.cola=64
# Tiempo límite de cada fuente y de la respuesta completa del tablero, en milisegundos.
portal.tablero.limite-fuente-ms=1500
portal.tablero.limite-total-ms=3000
