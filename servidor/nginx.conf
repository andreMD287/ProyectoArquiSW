resolver 127.0.0.11 valid=5s ipv6=off;
# Límite de intentos de inicio de sesión por dirección IP (solo POST): frena la adivinación de contraseñas.
map $request_method $intento_login { POST $binary_remote_addr; default ""; }
limit_req_zone $intento_login zone=login:10m rate=30r/m;
upstream mapas_api {
    zone mapas_api 64k;
    server api:8080 resolve;
}
upstream reconstruccion_api {
    zone reconstruccion_api 64k;
    server reconstruccion:8086 resolve;
}
# UD-09 Portal web: toda la interfaz web (ASP.NET Core Razor Pages).
upstream portal_web {
    zone portal_web 64k;
    server portal:8080 resolve;
}
server {
    listen 80;
    server_tokens off;
    add_header Cache-Control "no-cache" always;
    client_max_body_size 2m;
    location = /api/auth/login {
        limit_req zone=login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://mapas_api;
        proxy_connect_timeout 5s;
    }
    location = /login {
        limit_req zone=login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://portal_web;
        proxy_connect_timeout 5s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/campo/lotes {
        client_max_body_size 8m;
        proxy_pass http://mapas_api;
    }
    # UD-06 Reconstrucción: su API y su interfaz entran por la misma entrada
    location /api/reconstruccion/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://reconstruccion_api;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
    }
    location /api/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://mapas_api;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://portal_web;
        proxy_connect_timeout 5s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
